services:
  - type: web
    name: fittrack-backend
    runtime: python
    buildCommand: "cd backend && ./build.sh"
    startCommand: "gunicorn --chdir backend fittrack.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: fittrack-db
    databaseName: fittrack_db
    user: fittrack
    plan: free
